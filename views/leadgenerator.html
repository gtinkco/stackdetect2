<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Generation Tool</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/leadgenerator.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Find Websites Using Your Favorite Technologies</h1>
      <p>Generate leads by discovering websites based on their tech stack.</p>
    </header>

    <div class="search-section">
      <input type="text" id="search-input" placeholder="Search for a technology (e.g., WordPress, Shopify, React)">
      <button id="search-btn">Search</button>
    </div>

    <div class="filter-section">
      <select id="industry-filter">
        <option value="">Select Industry</option>
        <option value="ecommerce">E-commerce</option>
        <option value="saas">SaaS</option>
        <option value="blog">Blog</option>
      </select>
      <select id="traffic-filter">
        <option value="">Select Traffic Range</option>
        <option value="low">&lt;10k</option>
        <option value="medium">10k-50k</option>
        <option value="high">&gt;50k</option>
      </select>
      <select id="region-filter">
        <option value="">Select Region</option>
        <option value="global">Global</option>
        <option value="us">United States</option>
        <option value="eu">Europe</option>
      </select>
    </div>

    <div class="results-section">
      <table id="results-table">
        <thead>
          <tr>
            <th>Website URL</th>
            <th>Technology Stack</th>
            <th>Industry</th>
            <th>Estimated Traffic</th>
            <th>Contact Info</th>
          </tr>
        </thead>
        <tbody>
          <!-- Results will populate here -->
        </tbody>
      </table>
    </div>

    <div class="export-section">
      <button id="export-csv">Export to CSV</button>
      <button id="export-pdf">Export to PDF</button>
      <button id="export-json">Export to JSON</button>
    </div>

    <footer class="footer">
      <p>Need help? <a href="#">Visit our FAQ</a> or <a href="#">contact support</a>.</p>
    </footer>
  </div>

  <script src="/js/script.js"></script>
</body>
</html>
