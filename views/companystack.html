<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Stack Lookup</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/companystack.css">
    <link rel="stylesheet" href="/css/styles.css">
 
</head>
<body>
    <div class="header">
        <h1>Company Stack Lookup</h1>
    </div>

    <div class="content">
        <div class="search-bar">
            <label for="company">Enter Company Name:</label>
            <input type="text" id="company" placeholder="e.g., Amazon, Google" />
            <button id="search-btn">Search</button>
        </div>

        <div class="results">
            <h2>Tech Stack</h2>
            <div id="stack-list" class="stack-list">
                <!-- Tech stack results will be displayed here -->
            </div>
        </div>
    </div>

    <script src="/js/script.js"></script>
</body>
</html>
